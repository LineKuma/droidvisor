# Droidvisor Docker Compose Configuration for Testing
services:
  # Android SDK 测试环境服务
  android-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: droidvisor-android-test
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
      - GRADLE_USER_HOME=/workspace/.gradle
    networks:
      - droidvisor-test-network
    healthcheck:
      test: ["CMD", "bash", "-c", "ps aux | grep -v grep | grep gradle"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  droidvisor-test-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
