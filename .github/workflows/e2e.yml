name: E2E Tests

on:
  push:
    branches: [main, master, develop, agent-develop, trae/solo-agent-HyUTID]
  pull_request:
    branches: [main, master, develop, agent-develop, trae/solo-agent-HyUTID]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  e2e-test:
    name: Instrumented E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]

    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Project
        uses: ./.github/actions/setup-android

      # ========== QEMU 环境安装 ==========
      - name: Install QEMU for VM runtime testing
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils \
            qemu-system-arm ovmf \
            openssh-client wget curl

          # 验证 QEMU 安装
          qemu-system-x86_64 --version
          qemu-img --version

          # 创建测试用磁盘镜像目录
          mkdir -p /tmp/qemu-test-disks

          # 创建一个最小的 qcow2 测试镜像（用于 E2E 测试验证）
          qemu-img create -f qcow2 /tmp/qemu-test-disks/e2e-test-disk.qcow2 1G

          echo "QEMU 安装完成，二进制路径:"
          which qemu-system-x86_64
          which qemu-img

      - name: AVD Cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-${{ matrix.api-level }}-${{ runner.os }}-v7

      - name: Create AVD and Generate Snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          disable-animations: true
          script: echo "AVD snapshot generated"

      - name: Run E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          disable-animations: true
          script: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon && adb uninstall com.droidvisor 2>/dev/null || true && adb uninstall com.droidvisor.test 2>/dev/null || true && adb install -r app/build/outputs/apk/debug/app-debug.apk && adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk && adb shell pm grant com.droidvisor android.permission.READ_MEDIA_IMAGES 2>/dev/null || true && adb shell pm grant com.droidvisor android.permission.WRITE_EXTERNAL_STORAGE 2>/dev/null || true && adb shell "mkdir -p /data/local/tmp/qemu-e2e" && adb push /tmp/qemu-test-disks/e2e-test-disk.qcow2 /data/local/tmp/qemu-e2e/ && adb shell am instrument -w -e package com.droidvisor.e2e -e debug false com.droidvisor.test/androidx.test.runner.AndroidJUnitRunner

      - name: Upload E2E Test Results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: e2e-test-results-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 14

      - name: Publish E2E Test Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: app/build/outputs/androidTest-results/connected/*.xml
          check_name: E2E Test Results (API ${{ matrix.api-level }})
