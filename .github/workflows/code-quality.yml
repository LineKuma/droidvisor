name: Code Quality

on:
  push:
    branches: [main, agent-develop]
  pull_request:
    branches: [main, agent-develop]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  checks: write
  security-events: write
  pull-requests: write

jobs:
  detekt:
    name: Detekt Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Project
        uses: ./.github/actions/setup-android

      - name: Run Detekt
        run: ./gradlew detekt --no-daemon --stacktrace

      - name: Upload Detekt Report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: detekt-report
          path: |
            app/build/reports/detekt/detekt.html
            app/build/reports/detekt/detekt.md
          retention-days: 14

      - name: Upload Detekt to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: app/build/reports/detekt/detekt.sarif
          category: detekt
          wait-for-processing: true

  dependency-review:
    name: Dependency Vulnerability Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: 'high'
          fail-on-scopes: 'runtime'
          deny-licenses: ''
          vulnerability-check: true
          license-check: false

  scheduled-dependency-scan:
    name: Scheduled Dependency Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1
        with:
          scan-args: |-
            --recursive
            --format=table
            .
        continue-on-error: true

      - name: Notify on vulnerability found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Dependency vulnerability found (${context.sha.substring(0, 7)})`,
              body: `OSV-Scanner detected vulnerabilities.\n\n[View scan results](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['security', 'dependencies']
            });
