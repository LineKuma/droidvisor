name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERSION_NAME: ${{ inputs.version || github.ref_name }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Project
        uses: ./.github/actions/setup-android

      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: release-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          retention-days: 7

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Project
        uses: ./.github/actions/setup-android

      - name: Set version name
        run: |
          TAG_VERSION=$VERSION_NAME
          if [[ $TAG_VERSION == v* ]]; then
            TAG_VERSION=${TAG_VERSION:1}
          fi
          sed -i "s/versionName \".*\"/versionName \"$TAG_VERSION\"/" app/build.gradle

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename Release APK
        run: |
          TAG_VERSION=$VERSION_NAME
          if [[ $TAG_VERSION == v* ]]; then
            TAG_VERSION=${TAG_VERSION:1}
          fi
          cp app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/droidvisor-$TAG_VERSION.apk

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename Debug APK
        run: |
          TAG_VERSION=$VERSION_NAME
          if [[ $TAG_VERSION == v* ]]; then
            TAG_VERSION=${TAG_VERSION:1}
          fi
          cp app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/droidvisor-$TAG_VERSION-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/droidvisor-*.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/droidvisor-*-debug.apk
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release-artifacts/

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
