name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

env:
  VERSION_NAME: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set version name
        run: |
          sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" app/build.gradle

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        # Note: For production, use a proper signing config with secrets
        # This is a placeholder for demo purposes
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/droidvisor-$VERSION_NAME.apk

      - name: Upload Release APK
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/droidvisor-$VERSION_NAME.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
