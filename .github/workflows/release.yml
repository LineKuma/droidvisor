name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

env:
  VERSION_NAME: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set version name
        run: |
          sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" app/build.gradle

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/droidvisor-$VERSION_NAME.apk

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename Debug APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/droidvisor-$VERSION_NAME-debug.apk

      - name: Upload Release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/droidvisor-$VERSION_NAME.apk
          retention-days: 30

      - name: Upload Debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/droidvisor-$VERSION_NAME-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.version
        with:
          files: |
            app/build/outputs/apk/release/droidvisor-$VERSION_NAME.apk
            app/build/outputs/apk/debug/droidvisor-$VERSION_NAME-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
