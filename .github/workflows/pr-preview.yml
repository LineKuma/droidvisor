name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, master, develop, agent-develop ]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

timeout-minutes: 20

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

  build-pr:
    name: Build PR #${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build
        run: ./gradlew assembleDebug

      - name: Upload APK as PR Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pr-${{ github.event.pull_request.number }}-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5

      - name: Comment on PR with Build Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.build.outcome }}';
            const statusEmoji = status === 'success' ? '✅' : '❌';
            const statusText = status === 'success' ? 'Build succeeded!' : 'Build failed!';
            const body = `${statusEmoji} ${statusText}\n\n` +
              `${status === 'success' ? 'APK artifact available for download.' : 'Please check the logs for details.'}\n\n` +
              `Commit: ${context.sha.substring(0, 7)}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });