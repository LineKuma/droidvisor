name: Docker Integration

on:
  push:
    branches: [main, master, develop, agent-develop]
  pull_request:
    branches: [main, master, develop, agent-develop]
  workflow_dispatch:

concurrency:
  group: docker-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ===== Docker 基础功能验证 =====
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hello-World Test
        run: |
          docker pull hello-world
          docker run --rm hello-world
          echo "Docker hello-world test passed"

      - name: Docker Container Lifecycle Test
        run: |
          docker run -d --name test-alpine alpine:latest sleep 60
          docker ps | grep test-alpine
          docker stop test-alpine
          docker rm test-alpine
          echo "Docker container lifecycle test passed"

      # ===== Docker Compose 构建环境验证 =====
      - name: Build Android Test Environment via Compose
        run: docker compose build android-test

      - name: Verify Docker Compose Environment Can Build
        timeout-minutes: 15
        run: |
          docker compose run --rm \
            -e JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 \
            -e ANDROID_HOME=/opt/android-sdk \
            android-test \
            /workspace/gradlew assembleDebug --stacktrace

      # ===== APK 构建验证（原生环境）=====
      - name: Build Debug APK (Native)
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Built
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk || (echo "APK not found" && exit 1)
          echo "Debug APK built successfully"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: docker-integration-results
          path: |
            app/build/outputs/apk/debug/
          retention-days: 7
