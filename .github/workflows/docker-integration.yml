name: Docker Integration

on:
  push:
    branches: [main, master, develop, agent-develop]
  pull_request:
    branches: [main, master, develop, agent-develop]
  workflow_dispatch:

concurrency:
  group: docker-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ===== Docker 基础功能验证 =====
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Basic Validation
        run: |
          docker run --rm hello-world
          docker run -d --name test-alpine alpine:latest sleep 60
          docker ps | grep test-alpine
          docker stop test-alpine
          docker rm test-alpine
          echo "Docker basic tests passed"

      # ===== Docker Compose 构建环境验证 =====
      - name: Build Android Test Environment via Compose
        run: |
          export DOCKER_BUILDKIT=1
          docker compose build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            android-test

      - name: Verify Docker Compose Environment Can Build
        timeout-minutes: 12
        run: |
          docker compose run --rm \
            -e JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 \
            -e ANDROID_HOME=/opt/android-sdk \
            android-test \
            /workspace/gradlew assembleDebug --stacktrace --no-daemon

      # ===== APK 构建验证 =====
      - name: Verify APK Built
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk || (echo "APK not found" && exit 1)
          echo "Debug APK built successfully"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: docker-integration-results
          path: |
            app/build/outputs/apk/debug/
          retention-days: 7