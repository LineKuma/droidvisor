name: Docker Integration

on:
  push:
    branches: [main, master, develop, agent-develop]
  pull_request:
    branches: [main, master, develop, agent-develop]
  workflow_dispatch:

concurrency:
  group: docker-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-hello-world:
    name: Docker Hello-World Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull and Run hello-world
        run: |
          docker pull hello-world
          docker run --rm hello-world
          echo "✅ Docker hello-world test passed"

      - name: Build Android Test Environment
        run: docker compose build android-test

      - name: Run Unit Tests in Docker
        run: |
          docker compose run --rm \
            -e JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 \
            -e ANDROID_HOME=/opt/android-sdk \
            android-test \
            /workspace/gradlew testDebugUnitTest --stacktrace

      - name: Upload Docker Test Results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: docker-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  docker-vm-test:
    name: Docker VM Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Built
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk || (echo "❌ APK not found" && exit 1)
          echo "✅ Debug APK built successfully"

      - name: Start Docker Services
        run: docker compose up -d dind

      - name: Wait for Docker Daemon
        run: |
          timeout 60 bash -c 'until docker info > /dev/null 2>&1; do sleep 2; done'
          echo "✅ Docker daemon is ready"

      - name: Run Docker hello-world via DinD
        run: |
          docker exec droidvisor-dind docker pull hello-world
          docker exec droidvisor-dind docker run --rm hello-world
          echo "✅ DinD hello-world test passed"

      - name: Run Docker Container Lifecycle Test
        run: |
          docker exec droidvisor-dind docker run -d --name test-alpine alpine:latest sleep 60
          docker exec droidvisor-dind docker ps | grep test-alpine
          docker exec droidvisor-dind docker stop test-alpine
          docker exec droidvisor-dind docker rm test-alpine
          echo "✅ Docker container lifecycle test passed"

      - name: Stop Docker Services
        if: always()
        run: docker compose down -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: docker-vm-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
