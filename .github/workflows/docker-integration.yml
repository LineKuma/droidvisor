name: Docker Integration

on:
  push:
    branches: [main, master, develop, agent-develop]
  pull_request:
    branches: [main, master, develop, agent-develop]
  workflow_dispatch:

concurrency:
  group: docker-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-hello-world:
    name: Docker Hello-World Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull and Run hello-world
        run: |
          docker pull hello-world
          docker run --rm hello-world
          echo "Docker hello-world test passed"

      - name: Build Android Test Environment
        run: docker compose build android-test

      - name: Verify Docker Environment Can Build
        timeout-minutes: 15
        run: |
          # 重试机制：Docker 容器内 Gradle 下载可能因网络问题超时
          max_retries=3
          for i in $(seq 1 $max_retries); do
            echo "Attempt $i/$max_retries..."
            if docker compose run --rm \
              -e JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 \
              -e ANDROID_HOME=/opt/android-sdk \
              -e GRADLE_OPTS="-Dorg.gradle.daemon=false -Dhttp.socketTimeout=120000 -Dhttp.connectionTimeout=120000" \
              android-test \
              /workspace/gradlew assembleDebug --no-daemon --stacktrace; then
              echo "Build succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          echo "All $max_retries attempts failed"
          exit 1

      - name: Upload Docker Build Results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: docker-build-results
          path: app/build/outputs/apk/debug/
          retention-days: 7

  docker-vm-test:
    name: Docker VM Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Project
        uses: ./.github/actions/setup-android

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Built
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk || (echo "APK not found" && exit 1)
          echo "Debug APK built successfully"

      - name: Docker Container Lifecycle in VM
        run: |
          docker run -d --name vm-test-alpine alpine:latest sleep 60
          docker ps | grep vm-test-alpine
          docker stop vm-test-alpine
          docker rm vm-test-alpine
          echo "Docker VM container lifecycle test passed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: docker-vm-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
