name: CI

on:
  push:
    branches: [main, master, develop, agent-develop]
  pull_request:
    branches: [main, master, develop, agent-develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Project
        uses: ./.github/actions/setup-android

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Project
        uses: ./.github/actions/setup-android

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest \
            --tests "com.droidvisor.docker.*" \
            --tests "com.droidvisor.docker.model.*" \
            --tests "com.droidvisor.ui.viewmodel.*" \
            --tests "com.droidvisor.ui.components.*" \
            --tests "com.droidvisor.vm.*" \
            --tests "com.droidvisor.vm.model.*" \
            --tests "com.droidvisor.vm.vsock.*" \
            --tests "com.droidvisor.datastore.*" \
            --tests "com.droidvisor.util.*" \
            --stacktrace

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7

      - name: Publish Unit Test Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: app/build/test-results/testDebugUnitTest/*.xml
          check_name: Unit Test Results

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Project
        uses: ./.github/actions/setup-android

      - name: Run Integration Tests
        run: |
          ./gradlew testDebugUnitTest \
            --tests "com.droidvisor.integration.*" \
            --stacktrace

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: integration-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7

      - name: Publish Integration Test Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: app/build/test-results/testDebugUnitTest/*.xml
          check_name: Integration Test Results

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [lint, unit-test, integration-test]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Project
        uses: ./.github/actions/setup-android

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Comment PR with Build Status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = '✅ CI Pipeline Passed!\n\n' +
              '- Lint: Passed\n' +
              '- Unit Tests: Passed\n' +
              '- Integration Tests: Passed\n' +
              '- Build: Debug APK available for download\n\n' +
              `Commit: ${context.sha.substring(0, 7)}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
