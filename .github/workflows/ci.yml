name: CI

on:
  push:
    branches: [main, master, develop, agent-develop]
  pull_request:
    branches: [main, master, develop, agent-develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ===== Lint（仅 PR 时运行，避免与 Code Quality 重复）=====
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 仅在 PR 或手动触发时运行 lint（Code Quality workflow 已覆盖 push 场景）
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Project
        uses: ./.github/actions/setup-android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ci-lint-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ci-lint-${{ runner.os }}-

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace --no-daemon

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  # ===== 单元测试 + 集成测试（合并为单个 job，减少重复编译）=====
  test:
    name: Tests (Unit + Integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Project
        uses: ./.github/actions/setup-android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ci-test-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ci-test-${{ runner.os }}-

      - name: Run Unit Tests + Integration Tests
        run: |
          ./gradlew testDebugUnitTest \
            --tests "com.droidvisor.docker.*" \
            --tests "com.droidvisor.docker.model.*" \
            --tests "com.droidvisor.ui.viewmodel.*" \
            --tests "com.droidvisor.ui.components.*" \
            --tests "com.droidvisor.vm.*" \
            --tests "com.droidvisor.vm.model.*" \
            --tests "com.droidvisor.vm.vsock.*" \
            --tests "com.droidvisor.datastore.*" \
            --tests "com.droidvisor.util.*" \
            --tests "com.droidvisor.integration.*" \
            --no-daemon \
            --stacktrace \
            --continue

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: app/build/test-results/testDebugUnitTest/*.xml
          check_name: Test Results

      # ===== 测试覆盖率报告 =====
      - name: Generate Coverage Report
        if: always()
        run: |
          ./gradlew jacocoTestDebugUnitTestReport --no-daemon --continue || true

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: coverage-report
          path: app/build/reports/jacoco/
          retention-days: 7

  # ===== 构建（依赖测试通过）=====
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Project
        uses: ./.github/actions/setup-android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ci-build-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ci-build-${{ runner.os }}-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Comment PR with Build Status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = '✅ CI Pipeline Passed!\n\n' +
              '- Lint: Passed (or skipped)\n' +
              '- Unit Tests: Passed\n' +
              '- Integration Tests: Passed\n' +
              '- Build: Debug APK available for download\n\n' +
              `Commit: ${context.sha.substring(0, 7)}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
