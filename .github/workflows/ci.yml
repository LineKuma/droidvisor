name: CI

on:
  push:
    branches: [main, master, develop, agent-develop]
  pull_request:
    branches: [main, master, develop, agent-develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Project
        uses: ./.github/actions/setup-android

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  unit-test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Project
        uses: ./.github/actions/setup-android

      - name: Run All Tests
        run: |
          ./gradlew testDebugUnitTest \
            --no-daemon \
            --stacktrace

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: app/build/test-results/testDebugUnitTest/*.xml
          check_name: Test Results

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Project
        uses: ./.github/actions/setup-android

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Comment PR with Build Status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = '✅ CI Pipeline Passed!\n\n' +
              '- Lint: Passed\n' +
              '- Tests: Passed\n' +
              '- Build: Debug APK available for download\n\n' +
              `Commit: ${context.sha.substring(0, 7)}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: [unit-test]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Project
        uses: ./.github/actions/setup-android

      - name: Run Unit Tests with Coverage
        run: ./gradlew testDebugUnitTest jacocoTestReport --no-daemon --stacktrace

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/
          retention-days: 14

      - name: Generate Coverage Summary
        if: success() || failure()
        run: |
          echo "## Test Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f app/build/reports/jacoco/jacocoTestReport/html/index.html ]; then
            echo "Coverage report generated successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "Download the coverage-report artifact for detailed HTML report." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage report generation failed." >> "$GITHUB_STEP_SUMMARY"
          fi
