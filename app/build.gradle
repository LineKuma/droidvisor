plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'io.gitlab.arturbosch.detekt'
    id 'jacoco'
}

android {
    namespace 'com.droidvisor'
    compileSdk 35

    defaultConfig {
        applicationId "com.droidvisor"
        minSdk 34
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.create("release") {
                def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH") ?: "${rootDir}/release.jks"
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-P', 'plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=1.9.23']
    }
    buildFeatures {
        compose true
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    lint {
        sarifOutput = file("$buildDir/reports/lint-results-debug.sarif")
        abortOnError = true
    }
    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation platform('androidx.compose:compose-bom:2024.03.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'io.mockk:mockk:1.13.9'
    testImplementation 'io.kotest:kotest-assertions-core:5.8.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.03.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.compose.ui:ui-test'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

detekt {
    buildUponDefaultConfig = true
    allRules = false
    config = files("$rootDir/detekt-config.yml")
    ignoreFailures = false
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    reports {
        html.required = true
        xml.required = true
        sarif.required = true
        md.required = true
    }
}

// Jacoco 测试覆盖率配置
jacoco {
    toolVersion = "0.8.11"
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    group = "Reporting"
    description = "Generate Jacoco coverage reports for Debug build"

    def fileFilter = [
        '**/R.class', '**/R$*.class', '**/BuildConfig.*',
        '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*',
        '**/databinding/*', '**/androidx/**'
    ]

    def debugTree = fileTree(dir: "${project.buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: "${project.buildDir}", includes: [
        "jacoco/testDebugUnitTest.exec",
        "outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"
    ]))

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.register('installandrun') {
    dependsOn 'installDebug'
    group = 'install'
    description = 'Install debug APK, push QEMU + Debian assets, grant VM permission, enable AVF, and launch the app'

    doLast {
        def adb = "${android.sdkDirectory}/platform-tools/adb"
        def pkg = android.defaultConfig.applicationId

        // Discover connected devices; fall back to a single default if none listed.
        def devicesOut = new ByteArrayOutputStream()
        exec {
            commandLine adb, 'devices'
            standardOutput = devicesOut
            ignoreExitValue = true
        }
        def serials = devicesOut.toString().readLines()
                .drop(1)
                .collect { it.split(/\\s+/) }
                .findAll { it.size() >= 2 && it[1] == 'device' }
                .collect { it[0] }

        if (serials.isEmpty()) {
            serials = ['']
        }

        serials.each { serial ->
            def target = serial ? ['-s', serial] : []
            def pkgTarget = target

            logger.lifecycle(">> Preparing device ${serial ?: '(default)'}")

            // ── Push QEMU + Debian assets to app private external dir ──
            // Target: /storage/emulated/0/Android/data/<pkg>/files/
            //   qemu/bin/  → qemu-system-aarch64, qemu-img
            //   images/     → debian-12-nocloud-arm64.qcow2
            def remoteBase = "/storage/emulated/0/Android/data/${pkg}/files"
            def cacheDir = new File("${System.getProperty('user.home')}/.droidvisor/cache")

            // Ensure remote directories exist
            exec {
                commandLine = ([adb] + pkgTarget + [
                    'shell', 'mkdir', '-p',
                    "${remoteBase}/qemu/bin",
                    "${remoteBase}/images"
                ]) as List<String>
                ignoreExitValue = true
            }

            // Push QEMU source tarball
            def qemuTarball = new File(cacheDir, "qemu-${QEMU_VERSION}.tar.xz")
            if (qemuTarball.exists()) {
                logger.lifecycle("   Pushing QEMU source tarball (${qemuTarball.length()} bytes)...")
                exec {
                    commandLine = ([adb] + pkgTarget + [
                        'push', qemuTarball.absolutePath,
                        "${remoteBase}/qemu/bin/qemu-${QEMU_VERSION}.tar.xz"
                    ]) as List<String>
                    ignoreExitValue = true
                }
            } else {
                logger.warn("   QEMU source tarball not found at ${qemuTarball.absolutePath}")
                logger.warn("   Run 'downloadQemu' task first, or place the file manually.")
            }

            // Push Debian nocloud image
            def debianImage = new File(cacheDir, DEBIAN_IMAGE_FILENAME)
            if (debianImage.exists()) {
                logger.lifecycle("   Pushing Debian nocloud image (${debianImage.length()} bytes)...")
                exec {
                    commandLine = ([adb] + pkgTarget + [
                        'push', debianImage.absolutePath,
                        "${remoteBase}/images/${DEBIAN_IMAGE_FILENAME}"
                    ]) as List<String>
                    ignoreExitValue = true
                }
            } else {
                logger.warn("   Debian nocloud image not found at ${debianImage.absolutePath}")
                logger.warn("   Run 'downloadDebianImage' task first, or place the file manually.")
            }

            // ── Grant MANAGE_VIRTUAL_MACHINE permission ──
            logger.lifecycle(">> Attempting to grant MANAGE_VIRTUAL_MACHINE permission...")

            def grantStdout = new ByteArrayOutputStream()
            def grantStderr  = new ByteArrayOutputStream()

            // Try root shell first
            def rootResult = exec {
                commandLine = ([adb] + pkgTarget + ['root']) as List<String>
                ignoreExitValue = true
                standardOutput = new ByteArrayOutputStream()
                errorOutput    = new ByteArrayOutputStream()
            }
            if (rootResult.exitValue == 0) {
                logger.lifecycle("   adb root succeeded, retrying grant as root...")
                sleep(500)
            }

            def grantResult = exec {
                commandLine = ([adb] + pkgTarget + [
                    'shell', 'pm', 'grant', pkg, 'android.permission.MANAGE_VIRTUAL_MACHINE'
                ]) as List<String>
                ignoreExitValue = true
                standardOutput = grantStdout
                errorOutput    = grantStderr
            }

            if (grantResult.exitValue == 0) {
                logger.lifecycle("   MANAGE_VIRTUAL_MACHINE granted successfully")
            } else {
                def grantOut = grantStdout.toString().trim()
                def grantErr = grantStderr.toString().trim()
                logger.warn("   pm grant FAILED (exit=${grantResult.exitValue})")
                if (grantOut) logger.warn("   stdout: ${grantOut}")
                if (grantErr) logger.warn("   stderr: ${grantErr}")
                logger.warn("")
                logger.warn("   ╔══════════════════════════════════════════════════════════════╗")
                logger.warn("   ║  MANAGE_VIRTUAL_MACHINE is a signature|privileged permission ║")
                logger.warn("   ║  and could NOT be granted via unprivileged adb shell.        ║")
                logger.warn("   ║                                                              ║")
                logger.warn("   ║  Options:                                                    ║")
                logger.warn("   ║  1) Rooted device:  adb root && adb shell pm grant           ║")
                logger.warn("   ║  2) Custom AOSP:    install as priv-app in /system/priv-app/ ║")
                logger.warn("   ║  3) AVD w/ root:    use a userdebug/eng AVD image            ║")
                logger.warn("   ║  4) Ignore:         app will run in simulation mode          ║")
                logger.warn("   ╚══════════════════════════════════════════════════════════════╝")
            }

            // Verify the grant took effect
            def verifyOut = new ByteArrayOutputStream()
            exec {
                commandLine = ([adb] + pkgTarget + [
                    'shell', 'dumpsys', 'package', pkg
                ]) as List<String>
                ignoreExitValue = true
                standardOutput = verifyOut
                errorOutput    = new ByteArrayOutputStream()
            }
            def permLine = verifyOut.toString().readLines().find { it.contains('MANAGE_VIRTUAL_MACHINE') }
            if (permLine) {
                logger.lifecycle("   Permission status: ${permLine.trim()}")
            }

            // Flip the AVF enable flag; requires root on most builds, so ignore failures.
            exec {
                commandLine = ([adb] + pkgTarget + [
                    'shell', 'setprop', 'persist.virtualizationframework.enabled', 'true'
                ]) as List<String>
                ignoreExitValue = true
            }

            // Clear any stale process before launch.
            exec {
                commandLine = ([adb] + pkgTarget + ['shell', 'am', 'force-stop', pkg]) as List<String>
                ignoreExitValue = true
            }

            // Launch the main activity.
            logger.lifecycle(">> Launching ${pkg}/.MainActivity")
            exec {
                commandLine = ([adb] + pkgTarget + [
                    'shell', 'am', 'start', '-n', "${pkg}/.MainActivity"
                ]) as List<String>
                ignoreExitValue = true
            }
        }
    }
}

// ── QEMU 官方源码包下载 ─────────────────────────────────────
// 从 download.qemu.org 获取，缓存到 ~/.droidvisor/cache/
ext {
    QEMU_VERSION = '9.2.2'
    DEBIAN_IMAGE_FILENAME = 'debian-12-nocloud-arm64.qcow2'
}

tasks.register('downloadQemu') {
    group = 'install'
    description = 'Download QEMU official source tarball from download.qemu.org'

    doLast {
        def cacheDir = new File("${System.getProperty('user.home')}/.droidvisor/cache")
        cacheDir.mkdirs()

        def filename = "qemu-${QEMU_VERSION}.tar.xz"
        def url = "https://download.qemu.org/${filename}"
        def dest = new File(cacheDir, filename)

        if (dest.exists()) {
            logger.lifecycle(">> QEMU source already cached: ${dest.absolutePath} (${dest.length()} bytes)")
            return
        }

        logger.lifecycle(">> Downloading QEMU ${QEMU_VERSION} source from ${url} ...")
        dest.withOutputStream { out ->
            out << new URL(url).openStream()
        }
        logger.lifecycle(">> Downloaded to ${dest.absolutePath} (${dest.length()} bytes)")
    }
}

tasks.register('downloadDebianImage') {
    group = 'install'
    description = 'Download Debian 12 nocloud ARM64 disk image from cloud.debian.org'

    doLast {
        def cacheDir = new File("${System.getProperty('user.home')}/.droidvisor/cache")
        cacheDir.mkdirs()

        def url = "https://cloud.debian.org/images/cloud/bookworm/latest/${DEBIAN_IMAGE_FILENAME}"
        def dest = new File(cacheDir, DEBIAN_IMAGE_FILENAME)

        if (dest.exists()) {
            logger.lifecycle(">> Debian image already cached: ${dest.absolutePath} (${dest.length()} bytes)")
            return
        }

        logger.lifecycle(">> Downloading Debian 12 nocloud image from ${url} ...")
        logger.lifecycle("   (This is a large file, ~2GB, may take a while)")
        dest.withOutputStream { out ->
            out << new URL(url).openStream()
        }
        logger.lifecycle(">> Downloaded to ${dest.absolutePath} (${dest.length()} bytes)")
    }
}

tasks.register('downloadAssets') {
    group = 'install'
    description = 'Download all required assets: QEMU source + Debian nocloud image'
    dependsOn 'downloadQemu', 'downloadDebianImage'
}

tasks.register('createAvd') {
    group = 'avd'
    description = 'Create an x86_64 API 34 AVD named droidvisor_test (installs system image if missing)'

    doLast {
        def sdk = android.sdkDirectory.absolutePath
        def sdkmanager = "${sdk}/cmdline-tools/cmdline-tools/bin/sdkmanager"
        def avdmanager   = "${sdk}/cmdline-tools/cmdline-tools/bin/avdmanager"
        def avdName      = 'droidvisor_test'

        // Pick whichever image is already present; otherwise install the default one.
        def defaultImg  = 'system-images;android-34;default;x86_64'
        def googleImg   = 'system-images;android-34;google_apis;x86_64'
        def defaultDir  = new File(sdk, 'system-images/android-34/default/x86_64')
        def googleDir   = new File(sdk, 'system-images/android-34/google_apis/x86_64')

        def (systemImage, abi) = {
            if (googleDir.exists() && googleDir.listFiles()?.size() > 0) return [googleImg, 'google_apis/x86_64']
            if (defaultDir.exists() && defaultDir.listFiles()?.size() > 0) return [defaultImg, 'x86_64']

            // Neither installed yet — try default first (smaller, more mirrors).
            exec {
                commandLine sdkmanager, '--install', defaultImg,
                        'platforms;android-34', 'build-tools;34.0.0'
                ignoreExitValue = true
                standardInput = new ByteArrayInputStream('y\ny\ny\ny\ny\ny\ny\ny\n'.getBytes())
            }
            if (defaultDir.exists() && defaultDir.listFiles()?.size() > 0) {
                return [defaultImg, 'x86_64']
            }
            // Last resort
            exec {
                commandLine sdkmanager, '--install', googleImg
                ignoreExitValue = true
                standardInput = new ByteArrayInputStream('y\ny\ny\ny\ny\ny\ny\ny\n'.getBytes())
            }
            return [googleImg, 'google_apis/x86_64']
        }()

        // Skip if the AVD already exists.
        def listOut = new ByteArrayOutputStream()
        exec {
            commandLine avdmanager, 'list', 'avd'
            standardOutput = listOut
            ignoreExitValue = true
        }
        if (listOut.toString().contains(avdName)) {
            logger.lifecycle(">> AVD '${avdName}' already exists")
            return
        }

        exec {
            commandLine avdmanager, 'create', 'avd',
                    '--force',
                    '--name', avdName,
                    '--package', systemImage,
                    '--device', 'pixel_6',
                    '--abi', abi
            standardInput = new ByteArrayInputStream('\n'.getBytes())
            ignoreExitValue = true
        }
        logger.lifecycle(">> AVD '${avdName}' created")
    }
}

tasks.register('runE2E') {
    dependsOn 'installDebug'
    group = 'verification'
    description = 'Install debug APK, grant AVF permission, and run the HomepageRouteE2ETest on a connected device/AVD'

    doLast {
        def adb = "${android.sdkDirectory}/platform-tools/adb"
        def pkg = android.defaultConfig.applicationId

        // Grant AVF permission on every connected device (best-effort).
        def devicesOut = new ByteArrayOutputStream()
        exec {
            commandLine adb, 'devices'
            standardOutput = devicesOut
            ignoreExitValue = true
        }
        def serials = devicesOut.toString().readLines()
                .drop(1)
                .collect { it.split(/\\s+/) }
                .findAll { it.size() >= 2 && it[1] == 'device' }
                .collect { it[0] }

        serials.each { serial ->
            def target = serial ? ['-s', serial] : []
            def pkgTarget = target

            logger.lifecycle(">> Granting MANAGE_VIRTUAL_MACHINE on ${serial ?: '(default)'}")

            // Try root shell first
            exec {
                commandLine = ([adb] + pkgTarget + ['root']) as List<String>
                ignoreExitValue = true
                standardOutput = new ByteArrayOutputStream()
                errorOutput    = new ByteArrayOutputStream()
            }

            def grantStdout = new ByteArrayOutputStream()
            def grantStderr  = new ByteArrayOutputStream()
            def grantResult = exec {
                commandLine = ([adb] + pkgTarget + [
                    'shell', 'pm', 'grant', pkg, 'android.permission.MANAGE_VIRTUAL_MACHINE'
                ]) as List<String>
                ignoreExitValue = true
                standardOutput = grantStdout
                errorOutput    = grantStderr
            }

            if (grantResult.exitValue != 0) {
                def grantOut = grantStdout.toString().trim()
                def grantErr = grantStderr.toString().trim()
                logger.warn("   pm grant FAILED (exit=${grantResult.exitValue})")
                if (grantOut) logger.warn("   stdout: ${grantOut}")
                if (grantErr) logger.warn("   stderr: ${grantErr}")
                logger.warn("   App will run in simulation mode without this permission.")
            } else {
                logger.lifecycle("   MANAGE_VIRTUAL_MACHINE granted")
            }
        }

        // Run only the new homepage-route E2E class through connectedAndroidTest's runner.
        exec {
            commandLine adb, 'shell', 'am', 'instrument', '-w', '-r',
                    '-e', 'class', 'com.droidvisor.e2e.HomepageRouteE2ETest',
                    '-e', 'debug', 'false',
                    "${pkg}.test/androidx.test.runner.AndroidJUnitRunner"
            ignoreExitValue = false
        }
    }
}

// ═══════════════════════════════════════════════════════════════════════
// Docker E2E Tasks — pure UI E2E tests via Docker + AVD emulator
// ═══════════════════════════════════════════════════════════════════════

def dockerCompose = { args ->
    exec {
        workingDir = rootDir
        commandLine = ['docker', 'compose'] + args
    }
}

def dockerExec = { container, cmd ->
    exec {
        commandLine = ['docker', 'exec', container, 'sh', '-c', cmd]
    }
}

def adbInDocker = { container, cmd ->
    exec {
        commandLine = ['docker', 'exec', container, 'sh', '-c',
            "adb wait-for-device && $cmd"]
    }
}

ext {
    e2eContainerName = 'droidvisor-android-test'
    e2ePackageName = 'com.droidvisor'
}

tasks.register('dockerBuildE2eEnv') {
    group = 'docker-e2e'
    description = 'Build Docker image for E2E testing'
    doLast {
        logger.lifecycle(">> Building Docker E2E image...")
        exec {
            workingDir = rootDir
            commandLine = ['docker', 'build', '-t', 'droidvisor-e2e:latest', '.']
        }
        logger.lifecycle(">> Docker image built successfully")
    }
}

tasks.register('dockerStartEmulator') {
    group = 'docker-e2e'
    description = 'Start the android-test container with emulator for E2E tests'
    dependsOn 'dockerBuildE2eEnv'
    doLast {
        logger.lifecycle(">> Starting android-test container with emulator...")

        // Clean up any stale container
        exec {
            commandLine = ['docker', 'rm', '-f', e2eContainerName]
            ignoreExitValue = true
        }

        dockerCompose(['run', '--rm', '-d',
            '--name', e2eContainerName,
            '--service-ports',
            'android-test'])

        logger.lifecycle(">> Waiting for emulator to boot (healthcheck)...")
        def maxWait = 300
        def waited = 0
        def booted = false
        while (waited < maxWait) {
            def out = new ByteArrayOutputStream()
            exec {
                commandLine = ['docker', 'exec', e2eContainerName,
                    'sh', '-c',
                    'adb shell getprop sys.boot_completed 2>/dev/null']
                standardOutput = out
                ignoreExitValue = true
            }
            if (out.toString().trim() == '1') {
                booted = true
                logger.lifecycle(">> Emulator booted after ${waited}s")
                break
            }
            sleep(3000)
            waited += 3
        }
        if (!booted) {
            throw new GradleException("Emulator failed to boot within ${maxWait}s")
        }

        // Disable animations for reliable UI testing
        dockerExec(e2eContainerName,
            'adb shell settings put global window_animation_scale 0 && ' +
            'adb shell settings put global transition_animation_scale 0 && ' +
            'adb shell settings put global animator_duration_scale 0')
        logger.lifecycle(">> Emulator ready for E2E tests")
    }
}

tasks.register('dockerBuildE2eApks') {
    group = 'docker-e2e'
    description = 'Build debug APK and test APK inside Docker container'
    dependsOn 'dockerStartEmulator'
    doLast {
        logger.lifecycle(">> Building debug APK + test APK inside Docker...")
        dockerExec(e2eContainerName,
            'cd /workspace && ' +
            './gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace')
        logger.lifecycle(">> APKs built successfully")
    }
}

tasks.register('dockerInstallE2eApks') {
    group = 'docker-e2e'
    description = 'Install debug APK and test APK on the emulator'
    dependsOn 'dockerBuildE2eApks'
    doLast {
        logger.lifecycle(">> Installing APKs on emulator...")
        // Uninstall existing APKs first (avoid signature mismatch)
        dockerExec(e2eContainerName,
            "adb uninstall ${e2ePackageName} 2>/dev/null || true")
        dockerExec(e2eContainerName,
            "adb uninstall ${e2ePackageName}.test 2>/dev/null || true")
        // Install debug APK
        dockerExec(e2eContainerName,
            'adb install -r /workspace/app/build/outputs/apk/debug/app-debug.apk')
        // Install test APK
        dockerExec(e2eContainerName,
            'adb install -r /workspace/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk')
        logger.lifecycle(">> APKs installed successfully")
    }
}

tasks.register('dockerRunE2eTests') {
    group = 'docker-e2e'
    description = 'Run pure-UI E2E tests (Compose UI tests) on the emulator via Docker'
    dependsOn 'dockerInstallE2eApks'
    doLast {
        logger.lifecycle(">> Running E2E tests...")

        def testResultsDir = new File("${project.buildDir}/outputs/androidTest-results/connected")
        testResultsDir.mkdirs()

        // Run all E2E tests via instrumentation
        exec {
            commandLine = ['docker', 'exec', e2eContainerName,
                'sh', '-c',
                "timeout 30m adb shell am instrument -w -r " +
                "-e package com.droidvisor.e2e " +
                "-e debug false " +
                "${e2ePackageName}.test/androidx.test.runner.AndroidJUnitRunner " +
                "2>&1 | tee /workspace/app/build/outputs/androidTest-results/connected/e2e-instrumentation.log"]
            ignoreExitValue = true
        }

        // Pull test results from container
        exec {
            commandLine = ['docker', 'cp',
                "${e2eContainerName}:/workspace/app/build/outputs/androidTest-results/connected/.",
                "${project.buildDir}/outputs/androidTest-results/connected/"]
            ignoreExitValue = true
        }
        exec {
            commandLine = ['docker', 'cp',
                "${e2eContainerName}:/workspace/app/build/reports/androidTests/connected/.",
                "${project.buildDir}/reports/androidTests/connected/"]
            ignoreExitValue = true
        }

        logger.lifecycle(">> E2E tests completed. Results in:")
        logger.lifecycle("   - ${project.buildDir}/outputs/androidTest-results/connected/")
        logger.lifecycle("   - ${project.buildDir}/reports/androidTests/connected/")
    }
}

tasks.register('dockerStopEmulator') {
    group = 'docker-e2e'
    description = 'Stop and clean up the E2E Docker container'
    doLast {
        logger.lifecycle(">> Stopping E2E container...")
        exec {
            commandLine = ['docker', 'rm', '-f', e2eContainerName]
            ignoreExitValue = true
        }
        logger.lifecycle(">> Container stopped")
    }
}

tasks.register('dockerE2E') {
    group = 'docker-e2e'
    description = 'Full E2E pipeline: build Docker → start emulator → build APKs → run UI tests → cleanup'
    dependsOn tasks.dockerRunE2eTests
    // Ensure stop runs even if tests fail
    tasks.dockerRunE2eTests.finalizedBy tasks.dockerStopEmulator
    doLast {
        logger.lifecycle("╔══════════════════════════════════════════════╗")
        logger.lifecycle("║  Docker E2E Pipeline Complete               ║")
        logger.lifecycle("╚══════════════════════════════════════════════╝")
    }
}

// Quick alias: run only the homepage-route UI E2E tests
tasks.register('dockerE2EQuick') {
    group = 'docker-e2e'
    description = 'Quick E2E: run only HomepageRouteE2ETest (pure UI, fastest feedback)'
    dependsOn 'dockerInstallE2eApks'
    doLast {
        logger.lifecycle(">> Running quick E2E (HomepageRouteE2ETest)...")
        exec {
            commandLine = ['docker', 'exec', e2eContainerName,
                'sh', '-c',
                "timeout 15m adb shell am instrument -w -r " +
                "-e class com.droidvisor.e2e.HomepageRouteE2ETest " +
                "-e debug false " +
                "${e2ePackageName}.test/androidx.test.runner.AndroidJUnitRunner"]
            ignoreExitValue = true
        }
    }
}
dockerE2EQuick.finalizedBy tasks.dockerStopEmulator
